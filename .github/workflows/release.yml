name: Release and Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome extension
        run: npm run build

      - name: Build Firefox extension
        run: npm run build:firefox
        continue-on-error: true

      - name: Create Chrome ZIP package
        run: npm run zip

      - name: Create Firefox ZIP package
        run: npm run zip:firefox
        continue-on-error: true

      - name: Get tag name
        id: tag
        uses: dawidd6/action-get-tag@v1

      - name: Generate changelog
        id: changelog
        run: |
          # 获取上一个 tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            # 如果没有上一个 tag，获取所有提交
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            # 获取两个 tag 之间的提交
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          
          # 输出到文件
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # 也输出到文件供后续使用
          echo "$CHANGELOG" > CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            ## 📦 版本：${{ steps.tag.outputs.tag }}
            
            ### 📝 更新内容
            
            ${{ steps.changelog.outputs.changelog }}
            
            ---
            
            ## 📥 安装说明
            
            ### Chrome / Edge
            
            1. 下载 `chrome-table-to-excel-chrome-mv3.zip`
            2. 解压到任意目录
            3. 打开 Chrome 浏览器，访问 `chrome://extensions/`
            4. 开启右上角的「开发者模式」
            5. 点击「加载已解压的扩展程序」
            6. 选择解压后的目录
            
            ### Firefox
            
            1. 下载 `chrome-table-to-excel-firefox.zip`
            2. 解压到任意目录
            3. 打开 Firefox 浏览器，访问 `about:debugging#/runtime/this-firefox`
            4. 点击「临时载入附加组件」
            5. 选择解压后目录中的 `manifest.json` 文件
            
            ---
            
            ## 🔗 链接
            
            - [查看完整提交历史](https://github.com/${{ github.repository }}/commits)
            - [报告问题](https://github.com/${{ github.repository }}/issues)
          files: |
            dist/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Chrome build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: dist/chrome-mv3/
          retention-days: 30

      - name: Upload Firefox build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension
          path: dist/firefox-mv3/
          retention-days: 30
          if-no-files-found: ignore
