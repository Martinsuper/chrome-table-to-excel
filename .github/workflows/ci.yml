name: CI Build Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome extension
        run: npm run build

      - name: Build Firefox extension
        run: npm run build:firefox
        continue-on-error: true

      - name: Verify build output
        run: |
          ls -la dist/
          test -d dist/chrome-mv3 && echo "Chrome build successful" || echo "Chrome build failed"
          test -f dist/chrome-mv3/manifest.json && echo "manifest.json exists" || echo "manifest.json missing"

      - name: Upload Chrome build
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '20'
        with:
          name: chrome-extension-${{ matrix.node-version }}
          path: dist/chrome-mv3/
          retention-days: 7
